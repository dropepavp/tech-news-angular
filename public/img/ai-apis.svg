<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#090d16"/>
      <stop offset="50%" stop-color="#141c2e"/>
      <stop offset="100%" stop-color="#02162e"/>
    </linearGradient>
    <linearGradient id="purpleGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#8b5cf6"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad2)"/>

  <!-- Neural Net Nodes & Matrix -->
  <g opacity="0.35" stroke="#8b5cf6" stroke-width="1.5">
    <!-- Synapses -->
    <line x1="200" y1="120" x2="320" y2="200"/>
    <line x1="200" y1="220" x2="320" y2="200"/>
    <line x1="200" y1="320" x2="320" y2="200"/>
    <line x1="320" y1="200" x2="480" y2="160"/>
    <line x1="320" y1="200" x2="480" y2="280"/>
    <line x1="480" y1="160" x2="600" y2="210"/>
    <line x1="480" y1="280" x2="600" y2="210"/>
    <line x1="320" y1="200" x2="400" y2="340"/>
    <line x1="400" y1="340" x2="480" y2="280"/>
  </g>

  <!-- Glowing Nodes -->
  <circle cx="200" cy="120" r="8" fill="#06b6d4"/>
  <circle cx="200" cy="220" r="8" fill="#06b6d4"/>
  <circle cx="200" cy="320" r="8" fill="#06b6d4"/>
  <circle cx="320" cy="200" r="14" fill="#8b5cf6" filter="drop-shadow(0 0 12px #8b5cf6)"/>
  <circle cx="480" cy="160" r="14" fill="#3b82f6" filter="drop-shadow(0 0 12px #3b82f6)"/>
  <circle cx="480" cy="280" r="14" fill="#06b6d4" filter="drop-shadow(0 0 12px #06b6d4)"/>
  <circle cx="600" cy="210" r="18" fill="#a855f7" filter="drop-shadow(0 0 16px #a855f7)"/>
  <circle cx="400" cy="340" r="10" fill="#38bdf8"/>

  <!-- AI Brain / Chip Center Graphic -->
  <g transform="translate(400, 200)">
    <!-- Circuit frame -->
    <rect x="-70" y="-70" width="140" height="140" rx="20" fill="#0f172a" stroke="url(#purpleGlow)" stroke-width="4" filter="drop-shadow(0 0 20px rgba(139,92,246,0.5))"/>
    <!-- CPU Core -->
    <rect x="-40" y="-40" width="80" height="80" rx="10" fill="#1e1b4b" stroke="#8b5cf6" stroke-width="2"/>
    <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="24" fill="#38bdf8" text-anchor="middle">AI</text>
    <text x="0" y="24" font-family="'Outfit', sans-serif" font-weight="600" font-size="10" fill="#a78bfa" text-anchor="middle">API MODEL</text>
  </g>

  <!-- Category Badge -->
  <rect x="30" y="30" width="200" height="34" rx="17" fill="#002855" stroke="#8b5cf6" stroke-width="2"/>
  <text x="130" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#c084fc" text-anchor="middle">INTELIGENCIA ARTIFICIAL</text>

  <!-- Title Bottom Strip -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">
    LLMS &amp; AGENTES AUTÓNOMOS EN PRODUCCIÓN
  </text>
</svg>
