<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad1" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0b132b"/>
      <stop offset="50%" stop-color="#1c2541"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="angularGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#dd0031"/>
      <stop offset="100%" stop-color="#c3002f"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
  </defs>

  <!-- Background Grid -->
  <rect width="800" height="450" fill="url(#bgGrad1)"/>
  
  <g opacity="0.15" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="75" x2="800" y2="75"/>
    <line x1="0" y1="150" x2="800" y2="150"/>
    <line x1="0" y1="225" x2="800" y2="225"/>
    <line x1="0" y1="300" x2="800" y2="300"/>
    <line x1="0" y1="375" x2="800" y2="375"/>
    <line x1="100" y1="0" x2="100" y2="450"/>
    <line x1="200" y1="0" x2="200" y2="450"/>
    <line x1="300" y1="0" x2="300" y2="450"/>
    <line x1="400" y1="0" x2="400" y2="450"/>
    <line x1="500" y1="0" x2="500" y2="450"/>
    <line x1="600" y1="0" x2="600" y2="450"/>
    <line x1="700" y1="0" x2="700" y2="450"/>
  </g>

  <!-- Radial Glow Behind Shield -->
  <circle cx="400" cy="210" r="140" fill="#06b6d4" opacity="0.12" filter="blur(20px)"/>

  <!-- Reactive Signal Waves -->
  <g stroke="#06b6d4" stroke-width="3" fill="none" opacity="0.6">
    <circle cx="400" cy="210" r="100" stroke-dasharray="10 15"/>
    <circle cx="400" cy="210" r="150" stroke-dasharray="6 20"/>
    <circle cx="400" cy="210" r="200" stroke-dasharray="4 30"/>
  </g>

  <!-- Angular Shield Poly -->
  <g transform="translate(400, 200) scale(0.95)">
    <polygon points="0,-110 95,-70 80,60 0,110 -80,60 -95,-70" fill="url(#angularGrad)" filter="drop-shadow(0 10px 25px rgba(221,0,49,0.4))"/>
    <polygon points="0,-110 0,110 80,60 95,-70" fill="#b5002a"/>
    <!-- Center Letter A -->
    <path d="M 0,-70 L -45,45 L -20,45 L -9,15 L 9,15 L 20,45 L 45,45 Z M -5,-15 L 0,-32 L 5,-15 Z" fill="#ffffff"/>
  </g>

  <!-- Signal Pulse Nodes -->
  <g fill="#06b6d4">
    <circle cx="260" cy="130" r="8"/>
    <circle cx="540" cy="130" r="8"/>
    <circle cx="230" cy="280" r="10"/>
    <circle cx="570" cy="280" r="10"/>
    <circle cx="400" cy="350" r="9"/>
  </g>
  <g stroke="#38bdf8" stroke-width="2" opacity="0.7">
    <line x1="260" y1="130" x2="330" y2="160"/>
    <line x1="540" y1="130" x2="470" y2="160"/>
    <line x1="230" y1="280" x2="330" y2="250"/>
    <line x1="570" y1="280" x2="470" y2="250"/>
    <line x1="400" y1="350" x2="400" y2="300"/>
  </g>

  <!-- Card Category Badge Overlay -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#002855" stroke="#06b6d4" stroke-width="2"/>
  <text x="110" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle">DESARROLLO WEB</text>

  <!-- Title Bottom Strip -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">
    ANGULAR 18 • SIGNALS &amp; REACTIVITY
  </text>
</svg>
