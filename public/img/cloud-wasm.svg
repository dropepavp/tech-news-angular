<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad4" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0f172a"/>
      <stop offset="50%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
    <linearGradient id="blueCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#2563eb"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad4)"/>

  <!-- Cloud Shape with Glow -->
  <g transform="translate(400, 190) scale(1.3)" filter="drop-shadow(0 10px 25px rgba(37,99,235,0.4))">
    <!-- Cloud Path -->
    <path d="M -70 20 A 40 40 0 0 1 -40 -35 A 60 60 0 0 1 40 -35 A 40 40 0 0 1 70 20 A 30 30 0 0 1 50 50 L -50 50 A 30 30 0 0 1 -70 20 Z" 
          fill="#002855" stroke="url(#blueCyan)" stroke-width="4"/>
    <!-- WebAssembly / Server Icon inside -->
    <text x="0" y="15" font-family="'Outfit', sans-serif" font-weight="900" font-size="28" fill="#38bdf8" text-anchor="middle">WASM</text>
    <text x="0" y="35" font-family="'Outfit', sans-serif" font-weight="600" font-size="11" fill="#93c5fd" text-anchor="middle">K8S CLOUD</text>
  </g>

  <!-- Server Cubes Left and Right -->
  <g fill="#1e293b" stroke="#3b82f6" stroke-width="2">
    <rect x="120" y="160" width="80" height="30" rx="4"/>
    <circle cx="135" cy="175" r="3" fill="#10b981"/>
    <circle cx="145" cy="175" r="3" fill="#38bdf8"/>
    <rect x="120" y="200" width="80" height="30" rx="4"/>
    <circle cx="135" cy="215" r="3" fill="#10b981"/>
    <circle cx="145" cy="215" r="3" fill="#38bdf8"/>
    <rect x="120" y="240" width="80" height="30" rx="4"/>
    <circle cx="135" cy="255" r="3" fill="#10b981"/>
    <circle cx="145" cy="255" r="3" fill="#38bdf8"/>

    <rect x="600" y="160" width="80" height="30" rx="4"/>
    <circle cx="615" cy="175" r="3" fill="#10b981"/>
    <circle cx="625" cy="175" r="3" fill="#38bdf8"/>
    <rect x="600" y="200" width="80" height="30" rx="4"/>
    <circle cx="615" cy="215" r="3" fill="#10b981"/>
    <circle cx="625" cy="215" r="3" fill="#38bdf8"/>
    <rect x="600" y="240" width="80" height="30" rx="4"/>
    <circle cx="615" cy="255" r="3" fill="#10b981"/>
    <circle cx="625" cy="255" r="3" fill="#38bdf8"/>
  </g>

  <g stroke="#06b6d4" stroke-width="2" stroke-dasharray="6 6" opacity="0.6">
    <line x1="200" y1="215" x2="300" y2="215"/>
    <line x1="500" y1="215" x2="600" y2="215"/>
  </g>

  <!-- Category Badge -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#002855" stroke="#3b82f6" stroke-width="2"/>
  <text x="110" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#93c5fd" text-anchor="middle">CLOUD &amp; DEVOPS</text>

  <!-- Title Bottom Strip -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">
    KUBERNETES &amp; WEBASSEMBLY SERVERLESS
  </text>
</svg>
