<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="bgGrad3" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#051923"/>
      <stop offset="50%" stop-color="#003554"/>
      <stop offset="100%" stop-color="#051923"/>
    </linearGradient>
    <linearGradient id="emeraldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#10b981"/>
      <stop offset="100%" stop-color="#06b6d4"/>
    </linearGradient>
  </defs>

  <rect width="800" height="450" fill="url(#bgGrad3)"/>

  <!-- Radar Cones & Circles -->
  <g stroke="#10b981" stroke-width="1.5" fill="none" opacity="0.3">
    <circle cx="400" cy="200" r="80"/>
    <circle cx="400" cy="200" r="140"/>
    <circle cx="400" cy="200" r="200"/>
    <line x1="200" y1="200" x2="600" y2="200"/>
    <line x1="400" y1="0" x2="400" y2="400"/>
  </g>

  <!-- Giant Shield Center -->
  <g transform="translate(400, 200) scale(1.1)">
    <path d="M 0 -90 L 70 -50 L 70 20 C 70 70 0 95 0 95 C 0 95 -70 70 -70 20 L -70 -50 Z" 
          fill="#002855" stroke="url(#emeraldGrad)" stroke-width="5" filter="drop-shadow(0 0 25px rgba(16,185,129,0.4))"/>
    
    <!-- Padlock Graphic inside Shield -->
    <!-- Shackle -->
    <path d="M -18 -10 L -18 -30 C -18 -45 18 -45 18 -30 L 18 -10" fill="none" stroke="#10b981" stroke-width="6" stroke-linecap="round"/>
    <!-- Lock body -->
    <rect x="-26" y="-10" width="52" height="44" rx="8" fill="#10b981"/>
    <!-- Keyhole -->
    <circle cx="0" cy="8" r="5" fill="#002855"/>
    <polygon points="-3,8 3,8 2,22 -2,22" fill="#002855"/>
  </g>

  <!-- Category Badge -->
  <rect x="30" y="30" width="160" height="34" rx="17" fill="#002855" stroke="#10b981" stroke-width="2"/>
  <text x="110" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#6ee7b7" text-anchor="middle">CIBERSEGURIDAD</text>

  <!-- Title Bottom Strip -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">
    ZERO TRUST &amp; ARQUITECTURA CRIPTOGRÁFICA
  </text>
</svg>
