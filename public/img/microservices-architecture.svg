<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="microBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a38"/>
      <stop offset="50%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#05192d"/>
    </linearGradient>
    <linearGradient id="cyanGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <linearGradient id="nodeGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0284c7"/>
      <stop offset="100%" stop-color="#0369a1"/>
    </linearGradient>
  </defs>

  <!-- Background -->
  <rect width="800" height="450" fill="url(#microBg)"/>

  <!-- Network Grid Background -->
  <g opacity="0.12" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- Connection Traces / Network Bus -->
  <g stroke="#06b6d4" stroke-width="3" opacity="0.6" stroke-dasharray="6 6">
    <line x1="200" y1="210" x2="400" y2="130"/>
    <line x1="200" y1="210" x2="400" y2="210"/>
    <line x1="200" y1="210" x2="400" y2="290"/>
    <line x1="400" y1="130" x2="600" y2="210"/>
    <line x1="400" y1="210" x2="600" y2="210"/>
    <line x1="400" y1="290" x2="600" y2="210"/>
  </g>

  <!-- Flowing Pulse Data Dots -->
  <circle cx="300" cy="170" r="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <circle cx="300" cy="210" r="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <circle cx="300" cy="250" r="5" fill="#38bdf8" filter="drop-shadow(0 0 8px #38bdf8)"/>
  <circle cx="500" cy="170" r="5" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
  <circle cx="500" cy="210" r="5" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>
  <circle cx="500" cy="250" r="5" fill="#10b981" filter="drop-shadow(0 0 8px #10b981)"/>

  <!-- API Gateway (Left Node) -->
  <g transform="translate(200, 210)">
    <rect x="-65" y="-45" width="130" height="90" rx="12" fill="#001c3d" stroke="url(#cyanGrad)" stroke-width="3" filter="drop-shadow(0 8px 20px rgba(0,0,0,0.4))"/>
    <text x="0" y="-8" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">API</text>
    <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#06b6d4" text-anchor="middle">GATEWAY</text>
    <circle cx="0" cy="28" r="4" fill="#10b981"/>
  </g>

  <!-- Microservices Cluster (Center Nodes) -->
  <!-- Microservice 1: Auth & User -->
  <g transform="translate(400, 130)">
    <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#002855" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-4" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">AUTH SERVICE</text>
    <text x="0" y="14" font-family="'Inter', monospace" font-size="10" fill="#93c5fd" text-anchor="middle">JWT • -40% Latencia</text>
  </g>

  <!-- Microservice 2: Events & Data -->
  <g transform="translate(400, 210)">
    <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#002855" stroke="#06b6d4" stroke-width="2"/>
    <text x="0" y="-4" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">DATA SERVICE</text>
    <text x="0" y="14" font-family="'Inter', monospace" font-size="10" fill="#38bdf8" text-anchor="middle">Reactive Stream</text>
  </g>

  <!-- Microservice 3: Cache & Storage -->
  <g transform="translate(400, 290)">
    <rect x="-65" y="-32" width="130" height="64" rx="8" fill="#002855" stroke="#38bdf8" stroke-width="2"/>
    <text x="0" y="-4" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#ffffff" text-anchor="middle">CACHE SERVICE</text>
    <text x="0" y="14" font-family="'Inter', monospace" font-size="10" fill="#93c5fd" text-anchor="middle">Redis • Memory Opt</text>
  </g>

  <!-- Cloud / Client Output (Right Node) -->
  <g transform="translate(600, 210)">
    <rect x="-65" y="-45" width="130" height="90" rx="12" fill="#001c3d" stroke="#10b981" stroke-width="3" filter="drop-shadow(0 8px 20px rgba(0,0,0,0.4))"/>
    <text x="0" y="-8" font-family="'Outfit', sans-serif" font-weight="900" font-size="18" fill="#ffffff" text-anchor="middle">CLOUD</text>
    <text x="0" y="14" font-family="'Outfit', sans-serif" font-weight="700" font-size="12" fill="#10b981" text-anchor="middle">FRONT-END</text>
    <circle cx="0" cy="28" r="4" fill="#10b981"/>
  </g>

  <!-- Top Left Badge -->
  <rect x="30" y="30" width="190" height="34" rx="17" fill="#002855" stroke="#06b6d4" stroke-width="2"/>
  <text x="125" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle">ARQUITECTURA DE RED</text>

  <!-- Bottom Title -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle">
    MIGRACIÓN DE MICROSERVICIOS • RESPUESTAS EN TIEMPO REAL
  </text>
</svg>
