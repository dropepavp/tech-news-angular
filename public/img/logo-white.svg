<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 450 110" width="100%" height="100%">
  <!-- MATRAZ / LAB FLASK & CIRCUITOS BLANCO Y CIAN (PARA HEADER OSCURO) -->
  <g transform="translate(5, 5)">
    <!-- Circuit Nodes (Left) -->
    <circle cx="20" cy="30" r="6" fill="#06b6d4"/>
    <line x1="20" y1="30" x2="40" y2="42" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="40" cy="42" r="7" fill="#06b6d4"/>
    <line x1="40" y1="42" x2="20" y2="70" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    
    <circle cx="20" cy="70" r="6" fill="#06b6d4"/>
    <line x1="40" y1="42" x2="58" y2="28" stroke="#38bdf8" stroke-width="3" stroke-linecap="round"/>
    <circle cx="58" cy="28" r="6" fill="#06b6d4"/>

    <!-- Matraz Outline -->
    <path d="M 60 20 L 92 20 M 66 20 L 66 36 L 40 92 C 36 100 42 108 52 108 L 100 108 C 110 108 116 100 112 92 L 86 36 L 86 20" 
          fill="none" stroke="#ffffff" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
    
    <!-- Bubbles inside flask -->
    <circle cx="58" cy="92" r="3.5" fill="#38bdf8"/>
    <circle cx="68" cy="98" r="2.5" fill="#38bdf8"/>
    <circle cx="72" cy="86" r="4" fill="#38bdf8"/>

    <!-- Microchip (Center overlay) -->
    <rect x="60" y="52" width="32" height="32" rx="5" fill="#06b6d4" stroke="#ffffff" stroke-width="3"/>
    <rect x="66" y="58" width="20" height="20" rx="2" fill="#38bdf8"/>
    
    <!-- Chip Pins -->
    <line x1="52" y1="58" x2="60" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="65" x2="60" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="72" x2="60" y2="72" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="52" y1="78" x2="60" y2="78" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <line x1="92" y1="58" x2="100" y2="58" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="65" x2="100" y2="65" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="72" x2="100" y2="72" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>
    <line x1="92" y1="78" x2="100" y2="78" stroke="#38bdf8" stroke-width="2.5" stroke-linecap="round"/>

    <!-- Circuit Nodes (Right & Bottom) -->
    <path d="M 76 84 L 76 100 L 92 100" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="92" cy="100" r="4" fill="#06b6d4"/>

    <path d="M 96 52 L 108 40" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="108" cy="40" r="4" fill="#06b6d4"/>

    <path d="M 100 68 L 116 68 L 116 84" fill="none" stroke="#06b6d4" stroke-width="2.5"/>
    <circle cx="116" cy="84" r="4" fill="#06b6d4"/>
  </g>

  <!-- TEXTO TIPOGRÁFICO OFICIAL EN BLANCO Y CIAN -->
  <text x="135" y="64" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="900" font-size="44" fill="#ffffff" letter-spacing="-0.5">
    TECH<tspan fill="#06b6d4">&amp;</tspan>LAB
  </text>
  
  <text x="137" y="90" font-family="'Outfit', 'Segoe UI', sans-serif" font-weight="700" font-size="16" fill="#93c5fd" letter-spacing="2.5">
    NOTICIAS TECNOLÓGICAS
  </text>
</svg>
