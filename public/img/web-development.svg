<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" width="100%" height="100%">
  <defs>
    <linearGradient id="webBgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#001a38"/>
      <stop offset="50%" stop-color="#002855"/>
      <stop offset="100%" stop-color="#05192d"/>
    </linearGradient>
    <linearGradient id="cyanBlueGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#06b6d4"/>
      <stop offset="100%" stop-color="#3b82f6"/>
    </linearGradient>
    <linearGradient id="htmlGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#e34f26"/>
      <stop offset="100%" stop-color="#f06529"/>
    </linearGradient>
    <linearGradient id="jsGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f7df1e"/>
      <stop offset="100%" stop-color="#eab308"/>
    </linearGradient>
    <linearGradient id="cssGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#264de4"/>
      <stop offset="100%" stop-color="#2965f1"/>
    </linearGradient>
  </defs>

  <!-- Background Canvas -->
  <rect width="800" height="450" fill="url(#webBgGrad)"/>

  <!-- Subtle Web Grid -->
  <g opacity="0.1" stroke="#38bdf8" stroke-width="1">
    <line x1="0" y1="90" x2="800" y2="90"/>
    <line x1="0" y1="180" x2="800" y2="180"/>
    <line x1="0" y1="270" x2="800" y2="270"/>
    <line x1="0" y1="360" x2="800" y2="360"/>
    <line x1="160" y1="0" x2="160" y2="450"/>
    <line x1="320" y1="0" x2="320" y2="450"/>
    <line x1="480" y1="0" x2="480" y2="450"/>
    <line x1="640" y1="0" x2="640" y2="450"/>
  </g>

  <!-- BROWSER WINDOW (VENTANA WEB PRINCIPAL) -->
  <g transform="translate(400, 200)" filter="drop-shadow(0 15px 30px rgba(0,0,0,0.5))">
    <!-- Window Frame -->
    <rect x="-260" y="-120" width="520" height="240" rx="14" fill="#0b132b" stroke="url(#cyanBlueGrad)" stroke-width="3"/>
    
    <!-- Window Header Bar -->
    <path d="M -260 -106 C -260 -114 -254 -120 -246 -120 L 246 -120 C 254 -120 260 -114 260 -106 L 260 -80 L -260 -80 Z" fill="#002855"/>
    
    <!-- Traffic light dots -->
    <circle cx="-236" cy="-100" r="5.5" fill="#ef4444"/>
    <circle cx="-220" cy="-100" r="5.5" fill="#f59e0b"/>
    <circle cx="-204" cy="-100" r="5.5" fill="#10b981"/>

    <!-- URL Bar -->
    <rect x="-170" y="-108" width="340" height="17" rx="8.5" fill="rgba(255,255,255,0.1)"/>
    <text x="0" y="-95" font-family="'Inter', monospace" font-size="10.5" fill="#93c5fd" text-anchor="middle">https://technews.lab/desarrollo-web</text>

    <!-- Code Tags & Web Trio Inside Window -->
    <!-- Large Code Tag Symbol </> -->
    <g transform="translate(0, 15)">
      <!-- Left Tag Bracket < -->
      <path d="M -110 -35 L -160 0 L -110 35" fill="none" stroke="#06b6d4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Right Tag Bracket > -->
      <path d="M 110 -35 L 160 0 L 110 35" fill="none" stroke="#06b6d4" stroke-width="9" stroke-linecap="round" stroke-linejoin="round"/>
      
      <!-- Slash / -->
      <line x1="25" y1="-45" x2="-25" y2="45" stroke="#38bdf8" stroke-width="7" stroke-linecap="round"/>

      <!-- Triad Icons (HTML5 - CSS3 - JS) -->
      <!-- HTML5 Badge -->
      <g transform="translate(-55, -20) scale(0.65)">
        <polygon points="0,-40 36,-28 30,28 0,38 -30,28 -36,-28" fill="url(#htmlGrad)"/>
        <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">&lt;H5&gt;</text>
      </g>

      <!-- CSS3 Badge -->
      <g transform="translate(0, 24) scale(0.65)">
        <polygon points="0,-40 36,-28 30,28 0,38 -30,28 -36,-28" fill="url(#cssGrad)"/>
        <text x="0" y="8" font-family="'Outfit', sans-serif" font-weight="900" font-size="20" fill="#ffffff" text-anchor="middle">{CSS}</text>
      </g>

      <!-- JS Badge -->
      <g transform="translate(55, -20) scale(0.65)">
        <rect x="-32" y="-32" width="64" height="64" rx="8" fill="url(#jsGrad)"/>
        <text x="0" y="10" font-family="'Outfit', sans-serif" font-weight="900" font-size="26" fill="#000000" text-anchor="middle">JS</text>
      </g>
    </g>
  </g>

  <!-- Category Badge Top Left -->
  <rect x="30" y="30" width="170" height="34" rx="17" fill="#002855" stroke="#06b6d4" stroke-width="2"/>
  <text x="115" y="52" font-family="'Outfit', sans-serif" font-weight="700" font-size="13" fill="#38bdf8" text-anchor="middle">DESARROLLO WEB</text>

  <!-- Bottom Title Strip -->
  <text x="400" y="415" font-family="'Outfit', sans-serif" font-weight="800" font-size="22" fill="#f8fafc" text-anchor="middle" letter-spacing="1">
    HTML5 • CSS3 • JAVASCRIPT • FRONT-END LAB
  </text>
</svg>
